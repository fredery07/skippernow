name: Générer les pages SEO par ville

on:
  schedule:
    - cron: "0 4 * * *"   # tous les jours à 4h du matin (UTC)
  workflow_dispatch: {}    # bouton "Run workflow" pour lancer manuellement

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Générer les pages depuis Supabase
        run: node scripts/generate-city-pages.mjs

      - name: Publier les changements
        run: |
          git config user.name "skippernow-bot"
          git config user.email "actions@github.com"
          git add -A -- 'skipper-*' 'location-bateau-*' sitemap.xml
          if git diff --cached --quiet; then
            echo "Aucun changement à publier."
          else
            git commit -m "Mise à jour automatique des pages villes"
            git push
          fi
