name: Apply homepage partners fix

on:
  push:
    paths:
      - '.github/workflows/apply-home-partners-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch homepage source
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = '<script src="/partners-v2.js?v=20260911-2345"></script>'
          new = old + '\n<script src="/partners-carousel-v3.js?v=20260912-0834"></script>'
          if '/partners-carousel-v3.js' not in text:
              if old in text:
                  text = text.replace(old, new, 1)
              else:
                  text = text.replace('</body>', new + '\n</body>', 1)

          path.write_text(text, encoding='utf-8')
      - name: Commit production homepage fix
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Show partners inside homepage image carousel'
          git push
