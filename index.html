<style>
.quick-demand{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  margin:16px auto 10px;
  padding:20px 24px;
  border:1px solid #b9e9e4;
  border-radius:20px;
  background:linear-gradient(135deg,#eafaf8,#fff);
  box-shadow:0 10px 28px rgba(16,43,63,.08);
}
.quick-demand strong{
  display:block;
  color:#071d32;
  font-size:17px;
  margin-bottom:4px;
}
.quick-demand span{
  color:#637985;
  font-size:14px;
}
.quick-demand button{
  border:0;
  border-radius:13px;
  padding:13px 18px;
  background:#39d1c5;
  color:#071d32;
  font-weight:900;
  cursor:pointer;
  white-space:nowrap;
}
@media(max-width:640px){
  .quick-demand{
    flex-direction:column;
    align-items:stretch;
  }
  .quick-demand button{
    width:100%;
  }
}
</style>

<script>
(function(){
  const textes = {
    fr:{
      titre:"Vous ne trouvez pas exactement ce qu’il vous faut ?",
      texte:"Déposez une demande : les professionnels disponibles pourront vous répondre.",
      bouton:"Déposer une demande gratuite",
      demande:"Demande ouverte aux professionnels",
      port:"Indiquez d’abord votre port de départ."
    },
    en:{
      titre:"Can’t find exactly what you need?",
      texte:"Post a request and available professionals can reply.",
      bouton:"Post a free request",
      demande:"Open request to professionals",
      port:"Please enter your departure port first."
    },
    es:{
      titre:"¿No encuentras exactamente lo que necesitas?",
      texte:"Publica una solicitud y los profesionales disponibles podrán responder.",
      bouton:"Publicar una solicitud gratis",
      demande:"Solicitud abierta a profesionales",
      port:"Indica primero tu puerto de salida."
    }
  };

  function langue(){
    return localStorage.getItem("skippernow-language") || "fr";
  }

  function ouvrirDemande(){
    const txt = textes[langue()] || textes.fr;
    const champPort = document.querySelector("#portInput");
    const port = champPort ? champPort.value.trim() : "";

    if(!port){
      alert(txt.port);
      champPort?.focus();
      champPort?.scrollIntoView({behavior:"smooth",block:"center"});
      return;
    }

    if(typeof currentUser !== "undefined" && !currentUser){
      openAccountModal("create","client");
      return;
    }

    window.openBookingFor(
      null,
      txt.demande,
      port,
      typeof activeActivity !== "undefined" ? activeActivity : "skipper"
    );
  }

  function ajouterBouton(){
    if(document.querySelector("#quickDemand")) return;

    const zone = document.querySelector("#launchBanner")?.parentElement;
    if(!zone) return;

    const txt = textes[langue()] || textes.fr;
    const bloc = document.createElement("div");
    bloc.id = "quickDemand";
    bloc.className = "quick-demand";
    bloc.innerHTML =
      "<div><strong>"+txt.titre+"</strong><span>"+txt.texte+"</span></div>"+
      "<button type='button'>"+txt.bouton+"</button>";

    zone.appendChild(bloc);
    bloc.querySelector("button").addEventListener("click",ouvrirDemande);
  }

  ajouterBouton();
})();
</script>
